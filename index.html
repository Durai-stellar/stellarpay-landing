document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:italic}\n  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}\n  .wrap{max-width:1240px;margin:0 auto;padding:0 32px}\n\n  /* \u2500\u2500\u2500 Nav \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n  .nav{position:fixed;top:0;left:0;right:0;z-index:60;padding:18px 0;transition:background .25s,border-color .25s;border-bottom:1px solid transparent}\n  .nav.scrolled{background:rgba(10,10,10,.82);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom-color:rgba(255,255,255,.08)}\n  .nav-inner{display:flex;align-items:center;gap:36px;height:40px}\n  .brand{display:flex;align-items:center}\n  .logo-mark{height:30px;width:auto;display:block}\n  .nav-links{display:flex;gap:28px;margin-left:12px}\n  .nav-links a{font-size:13.5px;color:#B8B8BE;font-weight:500;transition:color .15s}\n  .nav-links a:hover{color:#fff}\n  .nav-spacer{flex:1}\n  .nav-cta{display:flex;align-items:center;gap:8px}\n  .btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font-size:13.5px;font-weight:600;letter-spacing:-.005em;transition:all .18s ease;white-space:nowrap}\n  .btn-ghost{color:#fff}\n  .btn-ghost:hover{background:rgba(255,255,255,.08)}\n  .btn-lime{background:var(--accent);color:var(--ink)}\n  .btn-lime:hover{background:#fff}\n  .btn-ink{background:var(--ink);color:#fff}\n  .btn-ink:hover{background:#000}\n  .btn-paper{background:var(--paper);color:var(--ink)}\n  .btn-paper:hover{background:#fff}\n  .btn-line{border:1px solid rgba(255,255,255,.22);color:#fff}\n  .btn-line:hover{border-color:#fff}\n  .btn-line-ink{border:1px solid rgba(10,10,10,.2);color:var(--ink)}\n  .btn-line-ink:hover{border-color:var(--ink)}\n\n  /* \u2500\u2500\u2500 HERO \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n  .hero{\n    position:relative;min-height:100vh;padding:140px 0 96px;\n    background:var(--ink);\n    overflow:hidden;isolation:isolate;display:flex;flex-direction:column;justify-content:center;\n  }\n  .hero::before{\n    content:\"\";position:absolute;inset:0;z-index:0;pointer-events:none;\n    background:radial-gradient(900px 500px at 70% 0%, rgba(232,255,58,.04), transparent 60%);\n  }\n  .hero-inner{position:relative;z-index:2}\n\n  /* Rotating globe \u2014 silhouette */\n  .globe{\n    position:absolute;top:50%;right:-18%;transform:translateY(-50%);\n    width:900px;height:900px;z-index:1;pointer-events:none;\n    mask-image:radial-gradient(circle at 50% 50%, #000 62%, transparent 82%);\n    -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 62%, transparent 82%);\n    opacity:.9;\n  }\n  .globe canvas{width:100%;height:100%;display:block}\n  @media (max-width:980px){.globe{display:none}}\n  /* Visually rebalance against right-side globe */\n  @media (min-width:981px){.hero .hero-inner{transform:translateX(-4vw)}}\n\n  .hero-top{\n    display:flex;align-items:center;gap:14px;margin-bottom:56px;color:#8e8e96;font-size:12.5px\n  }\n  .pill{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 14px 7px 10px;font-size:12.5px;color:#D3D3D9;font-weight:500}\n  .pill .ld{width:7px;height:7px;border-radius:50%;background:var(--accent);position:relative;box-shadow:0 0 8px var(--accent)}\n  .pill .ld::after{content:\"\";position:absolute;inset:-3px;border-radius:50%;border:1px solid var(--accent);animation:ping 1.8s ease-out infinite;opacity:.6}\n  @keyframes ping{0%{transform:scale(.6);opacity:.6}80%,100%{transform:scale(2);opacity:0}}\n\n  /* Kinetic headline */\n  h1.kinetic{\n    font-family:'Inter',sans-serif;font-weight:700;\n    font-size:clamp(56px,9.4vw,140px);\n    line-height:.94;letter-spacing:-.05em;\n    margin:0;padding:0;\n  }\n  h1.kinetic .line{display:flex;align-items:center;gap:.22em;flex-wrap:wrap}\n  h1.kinetic .serif{font-weight:400;font-style:italic;font-size:1.04em;letter-spacing:-.03em}\n\n  .fx-slot{\n    display:inline-flex;align-items:center;justify-content:center;\n    height:.92em;min-width:1.5em;padding:0 .18em;\n    border-radius:.2em;\n    background:var(--accent);color:var(--ink);\n    font-family:'Instrument Serif';font-weight:400;font-style:italic;font-size:1.08em;letter-spacing:-.02em;\n    vertical-align:baseline;line-height:1;\n    position:relative;overflow:hidden;\n    transform:translateY(.04em);\n  }\n  .fx-slot .sym{transition:transform .55s cubic-bezier(.7,0,.2,1), opacity .35s}\n  .fx-slot .sym.out{transform:translateY(-110%);opacity:0}\n  .fx-slot .sym.in {transform:translateY(0);opacity:1}\n  .fx-slot .sym.enter{transform:translateY(110%);opacity:0}\n\n  /* Hero sub + CTAs */\n  .hero-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:56px;margin-top:72px;flex-wrap:wrap}\n  .lede{font-size:18px;line-height:1.55;color:#B8B8BE;max-width:480px;margin:0}\n  .ctas{display:flex;gap:10px;flex-wrap:wrap;align-items:center}\n\n  /* \u2500\u2500\u2500 Live rate strip (calm, single row) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n  .rate-strip{background:#0D0D0D;border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06)}\n  .rate-strip-inner{display:grid;grid-template-columns:repeat(5,1fr);gap:0}\n  .rs-cell{padding:22px 24px;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:4px}\n  .rs-cell:last-child{border-right:0}\n  .rs-cell .k{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6E6E76}\n  .rs-cell .v{font-family:'Inter';font-weight:600;font-size:18px;letter-spacing:-.01em;color:#fff}\n  .rs-cell .d{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#8e8e96}\n  .rs-cell .d.up{color:var(--accent)}\n\n  /* \u2500\u2500\u2500 Intro / product promise \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n  .promise{background:var(--paper);color:var(--ink);padding:140px 0}\n  .eyebrow{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}\n  h2{font-family:'Inter';font-weight:700;font-size:clamp(38px,4.6vw,64px);line-height:1.02;letter-spacing:-.04em;margin:16px 0 0;max-width:900px}\n  h2 .serif{font-weight:400;font-style:italic;font-size:1.05em;letter-spacing:-.03em}\n\n  .promise-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:80px;border-top:1px solid rgba(10,10,10,.1)}\n  .promise-cell{padding:48px 0 8px;padding-right:36px;border-right:1px solid rgba(10,10,10,.1)}\n  .promise-cell:last-child{border-right:0}\n  .promise-cell:not(:first-child){padding-left:36px}\n  .promise-cell .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.14em;margin-bottom:20px}\n  .promise-cell h3{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin:0 0 20px;color:var(--ink)}\n  .promise-cell h3 .serif{font-weight:400;font-style:italic;font-size:1.06em;letter-spacing:-.02em}\n  .promise-cell .sol{color:#2a2a30;font-size:15.5px;line-height:1.55;margin:0 0 28px;max-width:340px;font-weight:500}\n  .promise-cell .prob-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}\n  .promise-cell .prob{margin:0;color:#8b8b92;font-size:13.5px;line-height:1.55;max-width:320px;padding-left:14px;border-left:2px solid rgba(10,10,10,.08);font-style:italic}\n\n  /* \u2500\u2500\u2500 Corridors \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n  .corridors{background:var(--ink);color:#fff;padding:140px 0}\n  .corr-head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-bottom:64px;flex-wrap:wrap}\n  .corr-head .eyebrow{color:#8e8e96}\n\n  .corr-grid{display:grid;grid-template-columns:380px 1fr;gap:40px}\n  .corr-list{border-top:1px solid rgba(255,255,255,.1)}\n  .corr-row{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:20px 4px;border-bottom:1px solid rgba(255,255,255,.1);cursor:pointer;transition:color .15s}\n  .corr-row .pair{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;color:#fff;letter-spacing:.02em}\n  .corr-row .name{color:#8e8e96;font-size:13.5px}\n  .corr-row .rate{font-family:'JetBrains Mono',monospace;font-size:13.5px;color:#8e8e96}\n  .corr-row.active .rate,.corr-row:hover .rate{color:var(--accent)}\n  .corr-row.active .name,.corr-row:hover .name{color:#fff}\n\n  .corr-stage{\n    position:relative;background:#0D0D0D;border:1px solid rgba(255,255,255,.08);\n    border-radius:20px;padding:40px;min-height:440px;display:flex;flex-direction:column;overflow:hidden;\n  }\n  .stage-title{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8e8e96}\n  .stage-big{font-family:'Inter';font-weight:700;font-size:clamp(32px,3.2vw,48px);line-height:1.02;letter-spacing:-.035em;margin:10px 0 0}\n  .stage-big .serif{font-weight:400;font-style:italic;font-size:1.05em;letter-spacing:-.02em}\n  .stage-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:36px;padding-top:28px;border-top:1px solid rgba(255,255,255,.08)}\n  .ss .n{font-family:'Instrument Serif';font-style:italic;font-size:44px;line-height:1;letter-spacing:-.02em}\n  .ss .n small{font-family:'Inter';font-style:normal;font-size:13px;color:#8e8e96;margin-left:3px}\n  .ss .l{margin-top:6px;font-size:12.5px;color:#8e8e96}\n\n  .stage-map{position:relative;margin-top:auto;padding-top:40px;height:180px}\n  .stage-map svg{width:100%;height:100%;display:block}\n  .map-city{position:absolute;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:4px 9px;border-radius:6px;transform:translate(-50%, calc(-100% - 12px));white-space:nowrap;transition:all .3s;pointer-events:none}\n  .map-city.active{background:var(--accent);color:var(--ink);border-color:var(--accent)}\n\n  /* \u2500\u2500\u2500 Research / talk to us \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n  .talk-sec{background:var(--paper);color:var(--ink);padding:180px 0;position:relative;overflow:hidden}\n  .talk-sec::before{content:\"\";position:absolute;top:0;right:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle, rgba(232,255,58,.22), transparent 65%);pointer-events:none;filter:blur(60px)}\n  .talk-wrap{max-width:1160px;margin:0 auto;position:relative;z-index:1}\n  .talk-head{max-width:900px;margin-bottom:80px}\n  .talk-lead{font-family:'Inter';font-weight:700;font-size:clamp(42px,5.2vw,76px);line-height:.98;letter-spacing:-.04em;margin:18px 0 0}\n  .talk-lead .serif{font-weight:400;font-style:italic;font-size:1.04em;letter-spacing:-.025em}\n  .talk-lead .hl{position:relative;display:inline-block;z-index:0}\n  .talk-lead .hl::after{content:\"\";position:absolute;left:-4px;right:-4px;bottom:8px;height:18px;background:var(--accent);z-index:-1;opacity:.8}\n\n  .talk-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:80px;align-items:start}\n  .talk-intro{color:#2a2a30;font-size:17px;line-height:1.6;max-width:480px}\n  .talk-intro p{margin:0 0 20px}\n  .talk-intro b{color:var(--ink);font-weight:600}\n\n  .talk-list{display:flex;flex-direction:column;gap:0;border-top:1px solid rgba(10,10,10,.12)}\n  .talk-item{display:grid;grid-template-columns:48px 1fr;gap:18px;padding:22px 0;border-bottom:1px solid rgba(10,10,10,.12);align-items:baseline}\n  .talk-item .idx{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--muted)}\n  .talk-item .q{font-family:'Instrument Serif';font-style:italic;font-size:22px;line-height:1.3;color:var(--ink);letter-spacing:-.005em}\n\n  .talk-foot{margin-top:64px;display:flex;align-items:center;justify-content:space-between;gap:40px;flex-wrap:wrap;padding-top:32px;border-top:1px solid rgba(10,10,10,.12)}\n  .talk-cta{display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:#fff;padding:18px 28px;border-radius:999px;text-decoration:none;font-size:15px;font-weight:500;transition:transform .2s ease, background .2s ease}\n  .talk-cta:hover{transform:translateX(2px);background:#2a2a30}\n  .talk-cta .arr{display:inline-block;transition:transform .3s ease}\n  .talk-cta:hover .arr{transform:translateX(4px)}\n  .talk-meta{display:flex;gap:28px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);align-items:center}\n  .talk-meta a{color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(10,10,10,.2);padding-bottom:2px}\n  .talk-meta a:hover{border-bottom-color:var(--ink)}\n  .talk-meta span{display:inline-flex;align-items:center;gap:8px}\n  .talk-meta .sep{width:4px;height:4px;border-radius:50%;background:var(--ink);opacity:.25}\n  /* \u2500\u2500\u2500 Testimonial cards (Linear-style) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n  .q-sec{background:var(--ink);color:#fff;padding:32px 0 120px;position:relative}\n  .q-wrap{max-width:1240px;margin:0 auto;padding:0 24px}\n  .q-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}\n  .q-card{position:relative;border-radius:22px;padding:40px 44px 32px;min-height:380px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}\n  .q-card .qt{font-family:'Inter';font-weight:500;font-size:clamp(22px,2vw,30px);line-height:1.24;letter-spacing:-.02em;margin:0;max-width:560px;position:relative;z-index:1}\n  .q-card .qt::before{content:\"\\201C\"}\n  .q-card .qt::after{content:\"\\201D\"}\n  .q-who{display:flex;align-items:center;gap:14px;margin-top:auto;padding-top:40px;position:relative;z-index:1}\n  .q-who .av{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Inter';font-weight:600;font-size:13px;letter-spacing:.02em}\n  .q-who .nm{display:flex;flex-direction:column;gap:2px}\n  .q-who .nm b{font-weight:600;font-size:14.5px;letter-spacing:-.005em}\n  .q-who .nm span{font-size:12.5px;opacity:.62}\n  .q-card.blue{background:linear-gradient(160deg,#d9e4ff 0%,#e5dcf1 55%,#efdbe5 100%);color:#0a0a0a}\n  .q-card.blue .av{background:#0a0a0a;color:#fff}\n  .q-card.lime{background:var(--accent);color:#0a0a0a}\n  .q-card.lime .av{background:#0a0a0a;color:var(--accent)}\n  .q-card .watermark{position:absolute;right:-20px;bottom:-40px;font-family:'Instrument Serif';font-style:italic;font-size:340px;line-height:.62;opacity:.09;pointer-events:none;letter-spacing:-.04em;z-index:0}\n  @media (max-width:860px){\n    .q-grid{grid-template-columns:1fr}\n    .q-card{min-height:280px;padding:32px}\n  }\n\n  /* \u2500\u2500\u2500 CTA \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n  .cta{background:var(--paper);color:var(--ink);padding:140px 0;position:relative;overflow:hidden;border-top:1px solid rgba(10,10,10,.06)}\n  .cta-inner{max-width:760px;position:relative}\n  .cta h2{max-width:680px}\n  .cta p{font-size:17px;color:#55555c;max-width:480px;margin:22px 0 32px;line-height:1.55}\n  .email-form{display:flex;gap:8px;background:#fff;border:1px solid rgba(10,10,10,.12);padding:6px;border-radius:999px;max-width:480px;box-shadow:0 2px 0 rgba(10,10,10,.04)}\n  .email-form input{flex:1;background:transparent;border:0;outline:0;padding:0 16px;color:var(--ink);font-size:14.5px;font-family:inherit}\n  .email-form input::placeholder{color:#9a9aa0}\n  .cta .micro{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#6E6E76;letter-spacing:.06em;margin-top:20px}\n  .cta .micro a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}\n\n  /* \u2500\u2500\u2500 Footer \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n  footer{background:var(--ink);color:#8e8e96;padding:72px 0 36px;border-top:1px solid rgba(255,255,255,.08)}\n  .foot-grid{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:40px;margin-bottom:56px}\n  .foot-grid h5{color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.04em;margin:0 0 16px}\n  .foot-grid ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}\n  .foot-grid a{font-size:13.5px;color:#8e8e96;transition:color .15s}\n  .foot-grid a:hover{color:#fff}\n  .foot-bio{color:#8e8e96;font-size:13.5px;line-height:1.55;margin:18px 0 0;max-width:280px}\n  .foot-bottom{display:flex;justify-content:space-between;align-items:center;padding-top:28px;border-top:1px solid rgba(255,255,255,.06);font-size:11.5px;color:#6E6E76;font-family:'JetBrains Mono',monospace;letter-spacing:.06em}\n  .foot-bottom .links{display:flex;gap:22px}\n\n  @media (max-width:980px){\n    .nav-links{display:none}\n    .nav-cta .btn-ghost{display:none}\n    h1.kinetic{font-size:clamp(46px,12vw,72px)}\n    .hero-bot{flex-direction:column;align-items:flex-start}\n    .rate-strip-inner{grid-template-columns:repeat(2,1fr)}\n    .rs-cell{border-bottom:1px solid rgba(255,255,255,.06)}\n    .q-sec{padding:100px 0}\n    .q-wrap{grid-template-columns:1fr;gap:20px}\n    .q-side{flex-direction:row;gap:20px;align-items:center}\n    .q-side .num{font-size:40px;margin:0}\n    .talk-sec{padding:100px 0}\n    .talk-grid{grid-template-columns:1fr;gap:40px}\n    .talk-head{margin-bottom:48px}\n    .talk-foot{flex-direction:column;align-items:flex-start;gap:24px}\n    .promise,.corridors,.q-sec,.cta{padding:90px 0}\n    .promise-grid{grid-template-columns:1fr;gap:0}\n    .promise-cell{border-right:0;border-bottom:1px solid rgba(10,10,10,.1);padding:32px 0 !important}\n    .corr-grid{grid-template-columns:1fr}\n    .stage-stats{grid-template-columns:1fr 1fr}\n    .foot-grid{grid-template-columns:1fr 1fr;gap:32px}\n    .foot-bottom{flex-direction:column;gap:14px;align-items:flex-start}\n  }\n</style>\n</head>\n<body>\n\n<!-- NAV \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n<nav class=\"nav\" id=\"nav\">\n  <div class=\"wrap nav-inner\">\n    <a href=\"#\" class=\"brand\" aria-label=\"StellarPay\"><img src=\"15978531-938a-4a2a-bd36-1768ced1f7d8\" alt=\"StellarPay\" class=\"logo-mark\"></a>\n    <div class=\"nav-links\">\n      <a href=\"#corridors\">Corridors</a>\n      <a href=\"#platform\">Platform</a>\n      <a href=\"#customers\">Customers</a>\n      <a href=\"#\">Docs</a>\n      <a href=\"#\">Pricing</a>\n    </div>\n    <div class=\"nav-spacer\"></div>\n    <div class=\"nav-cta\">\n      <a href=\"#\" class=\"btn btn-ghost\">Sign in</a>\n      <a href=\"#cta\" class=\"btn btn-lime\">Get a sandbox key \u2192</a>\n    </div>\n  </div>\n</nav>\n\n<!-- HERO \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n<section class=\"hero\">\n  <div class=\"globe\" aria-hidden=\"true\"><canvas id=\"globeCanvas\" width=\"900\" height=\"900\"></canvas></div>\n  <div class=\"wrap hero-inner\">\n    <div class=\"hero-top\">\n      <span class=\"pill\"><span class=\"ld\"></span>Live \u00b7 14 corridors</span>\n    </div>\n\n    <h1 class=\"kinetic\">\n      <span class=\"line\"><span>Cross-border</span></span>\n      <span class=\"line\"><span>payments,</span></span>\n      <span class=\"line\"><span class=\"serif\">reimagined.</span></span>\n    </h1>\n\n    <div class=\"hero-bot\">\n      <p class=\"lede\">The modern FX &amp; settlement layer for operators moving real volume. Bank-adjacent rates. Wire confirmation before you fund.</p>\n      <div class=\"ctas\">\n        <a href=\"#cta\" class=\"btn btn-lime\">Open an account \u2192</a>\n        <a href=\"#corridors\" class=\"btn btn-line\">See corridors</a>\n      </div>\n    </div>\n  </div>\n</section>\n\n<!-- LIVE RATE STRIP \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n<section class=\"rate-strip\">\n  <div class=\"rate-strip-inner\">\n    <div class=\"rs-cell\"><div class=\"k\">NGN / EUR</div><div class=\"v\">1,466.80</div><div class=\"d up\">+0.3%</div></div>\n    <div class=\"rs-cell\"><div class=\"k\">NGN / USD</div><div class=\"v\">1,601.20</div><div class=\"d up\">+0.2%</div></div>\n    <div class=\"rs-cell\"><div class=\"k\">NGN / CNY</div><div class=\"v\">221.45</div><div class=\"d\">\u22120.1%</div></div>\n    <div class=\"rs-cell\"><div class=\"k\">NGN / GBP</div><div class=\"v\">2,020.15</div><div class=\"d up\">+0.4%</div></div>\n    <div class=\"rs-cell\"><div class=\"k\">NGN / AED</div><div class=\"v\">436.02</div><div class=\"d up\">+0.3%</div></div>\n  </div>\n</section>\n\n<!-- PROMISE \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n<section class=\"promise\" id=\"platform\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow\">The platform</span>\n    <h2>What we <span class=\"serif\">solve.</span></h2>\n    <p style=\"max-width:560px;color:#55555c;font-size:17px;line-height:1.55;margin:20px 0 0\">Three things cross-border payments should just do.</p>\n\n    <div class=\"promise-grid\">\n      <div class=\"promise-cell\">\n        <div class=\"n\">01 \u00b7 SETTLEMENT</div>\n        <h3>Same-day settlement, <span class=\"serif\">every corridor.</span></h3>\n        <p class=\"sol\">Send in the morning. Supplier paid by close of business.</p>\n        <div class=\"prob-label\">What we replace</div>\n        <p class=\"prob\">Wires stuck 2 to 5 days in correspondent banks.</p>\n      </div>\n      <div class=\"promise-cell\">\n        <div class=\"n\">02 \u00b7 PRICING</div>\n        <h3>Rates within points <span class=\"serif\">of interbank.</span></h3>\n        <p class=\"sol\">Live mid-market rate on screen. Spread itemised. One number, no surprises.</p>\n        <div class=\"prob-label\">What we replace</div>\n        <p class=\"prob\">Hidden FX margins buried in the \u201cfee\u201d line.</p>\n      </div>\n      <div class=\"promise-cell\">\n        <div class=\"n\">03 \u00b7 VISIBILITY</div>\n        <h3>Track every payment <span class=\"serif\">end to end.</span></h3>\n        <p class=\"sol\">See exactly where your money is, from your account to the supplier\u2019s, in real time.</p>\n        <div class=\"prob-label\">What we replace</div>\n        <p class=\"prob\">Sending a wire and guessing for days where it is.</p>\n      </div>\n    </div>\n  </div>\n</section>\n\n<!-- CORRIDORS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n<section class=\"corridors\" id=\"corridors\">\n  <div class=\"wrap\">\n    <div class=\"corr-head\">\n      <div>\n        <span class=\"eyebrow\">Corridors</span>\n        <h2>Rails into the markets <span class=\"serif\">you actually trade with.</span></h2>\n      </div>\n    </div>\n\n    <div class=\"corr-grid\">\n      <div class=\"corr-list\" id=\"corrList\"></div>\n\n      <div class=\"corr-stage\" id=\"corrStage\">\n        <div class=\"stage-title\" id=\"sgPair\">NGN \u2192 EUR</div>\n        <div class=\"stage-big\" id=\"sgTitle\">Lagos to <span class=\"serif\">Brescia.</span></div>\n        <div class=\"stage-stats\">\n          <div class=\"ss\"><div class=\"n\" id=\"ssRate\">1,466.80</div><div class=\"l\">Indicative rate</div></div>\n          <div class=\"ss\"><div class=\"n\" id=\"ssTime\">3.8<small>hrs</small></div><div class=\"l\">Median settlement</div></div>\n          <div class=\"ss\"><div class=\"n\" id=\"ssVol\">$42.1<small>M</small></div><div class=\"l\">Settled this month</div></div>\n        </div>\n        <div class=\"stage-map\">\n          <svg viewBox=\"0 0 800 160\" preserveAspectRatio=\"none\">\n            <path id=\"arcPath\" d=\"M 120 120 Q 400 -30 680 80\" fill=\"none\" stroke=\"#E8FF3A\" stroke-width=\"1.4\" stroke-dasharray=\"4 6\"></path>\n            <circle id=\"fromDot\" cx=\"120\" cy=\"120\" r=\"5\" fill=\"#E8FF3A\"></circle>\n            <circle id=\"fromRing\" cx=\"120\" cy=\"120\" r=\"12\" fill=\"none\" stroke=\"#E8FF3A\" stroke-opacity=\".45\"></circle>\n            <circle id=\"toDot\" cx=\"680\" cy=\"80\" r=\"5\" fill=\"#fff\"></circle>\n          </svg>\n          <div class=\"map-city active\" id=\"mapFrom\" style=\"left:15%;top:78%\">Lagos</div>\n          <div class=\"map-city\" id=\"mapTo\" style=\"left:85%;top:50%\">Brescia</div>\n        </div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<!-- TALK TO US \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n<section class=\"talk-sec\" id=\"talk\">\n  <div class=\"wrap talk-wrap\">\n    <div class=\"talk-head\">\n      <span class=\"eyebrow\">We\u2019re still listening</span>\n      <div class=\"talk-lead\">Tell us <span class=\"hl\">what hurts</span><span class=\"serif\">.</span></div>\n    </div>\n\n    <div class=\"talk-grid\">\n      <div class=\"talk-intro\">\n        <p>StellarPay is early. We\u2019re still talking to founders, finance leads and operators to understand exactly where cross-border payments break for real teams.</p>\n        <p>If any of this sounds familiar, or if we\u2019ve framed it wrong, <b>come on a call.</b> No pitch, no deck. Twenty minutes so we can learn.</p>\n      </div>\n\n      <div class=\"talk-list\" aria-label=\"What we want to understand\">\n        <div class=\"talk-item\"><span class=\"idx\">01</span><span class=\"q\">Which corridor costs you the most sleep?</span></div>\n        <div class=\"talk-item\"><span class=\"idx\">02</span><span class=\"q\">What does a \u201cgood\u201d payment experience even look like for you?</span></div>\n        <div class=\"talk-item\"><span class=\"idx\">03</span><span class=\"q\">Where do your current tools quietly fall apart?</span></div>\n        <div class=\"talk-item\"><span class=\"idx\">04</span><span class=\"q\">What would actually make you switch?</span></div>\n      </div>\n    </div>\n\n    <div class=\"talk-foot\">\n      <a class=\"talk-cta\" href=\"mailto:hello@stellarpay.co\">Contact us <span class=\"arr\">\u2192</span></a>\n      <div class=\"talk-meta\">\n        <span><a href=\"mailto:hello@stellarpay.co\">hello@stellarpay.co</a></span>\n        <span class=\"sep\"></span>\n        <span>20 min call</span>\n        <span class=\"sep\"></span>\n        <span>No NDA needed</span>\n      </div>\n    </div>\n  </div>\n</section>\n\n<!-- TESTIMONIALS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n<section class=\"q-sec\" id=\"customers\">\n  <div class=\"q-wrap\">\n    <div class=\"q-grid\">\n      <article class=\"q-card blue\">\n        <p class=\"qt\">We replaced four tools with one platform. The team stopped working around the system and started working with it.</p>\n        <div class=\"q-who\">\n          <div class=\"av\">SR</div>\n          <div class=\"nm\"><b>Shivam R.</b><span>Director of Operations, Polymer Mfg</span></div>\n        </div>\n        <span class=\"watermark\" aria-hidden=\"true\">\u201d</span>\n      </article>\n      <article class=\"q-card lime\">\n        <p class=\"qt\">Settlement that used to take three days now clears before lunch.</p>\n        <div class=\"q-who\">\n          <div class=\"av\">AO</div>\n          <div class=\"nm\"><b>Amara O.</b><span>CFO, AgriExport Ltd</span></div>\n        </div>\n        <span class=\"watermark\" aria-hidden=\"true\">\u201d</span>\n      </article>\n    </div>\n  </div>\n</section>\n\n<!-- CTA \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n<section class=\"cta\" id=\"cta\">\n  <div class=\"wrap cta-inner\">\n    <span class=\"eyebrow\">Get started</span>\n    <h2>Cross-border payments, <span class=\"serif\">the way they should work.</span></h2>\n    <p>Open an account in 10 minutes. First transfer this week. No setup fees, no minimums.</p>\n    <form class=\"email-form\" onsubmit=\"event.preventDefault();this.querySelector('button').innerHTML='Request received \u2713'\">\n      <input type=\"email\" placeholder=\"you@company.com\" required=\"\">\n      <button class=\"btn btn-lime\" type=\"submit\">Request access \u2192</button>\n    </form>\n    <div class=\"micro\">SOC 2 Type II \u00b7 Licensed payments operator \u00b7 <a href=\"#\">Talk to sales</a></div>\n  </div>\n</section>\n\n<!-- FOOTER \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n<footer>\n  <div class=\"wrap\">\n    <div class=\"foot-grid\">\n      <div>\n        <img src=\"15978531-938a-4a2a-bd36-1768ced1f7d8\" alt=\"StellarPay\" class=\"logo-mark\">\n        <p class=\"foot-bio\">The modern cross-border payments platform. Built by operators who've lived the problem.</p>\n      </div>\n      <div>\n        <h5>Product</h5>\n        <ul><li><a href=\"#\">Payments</a></li><li><a href=\"#\">FX &amp; hedging</a></li><li><a href=\"#\">Accounts</a></li><li><a href=\"#\">API</a></li></ul>\n      </div>\n      <div>\n        <h5>Use cases</h5>\n        <ul><li><a href=\"#\">Suppliers</a></li><li><a href=\"#\">Buying-house</a></li><li><a href=\"#\">Treasury</a></li><li><a href=\"#\">Urgent transfers</a></li></ul>\n      </div>\n      <div>\n        <h5>Company</h5>\n        <ul><li><a href=\"#\">About</a></li><li><a href=\"#\">Customers</a></li><li><a href=\"#\">Careers</a></li><li><a href=\"#\">Press</a></li></ul>\n      </div>\n      <div>\n        <h5>Resources</h5>\n        <ul><li><a href=\"#\">Docs</a></li><li><a href=\"#\">Status</a></li><li><a href=\"#\">Security</a></li><li><a href=\"#\">Contact</a></li></ul>\n      </div>\n    </div>\n    <div class=\"foot-bottom\">\n      <div>\u00a9 2026 STELLARPAY, INC.</div>\n      <div class=\"links\"><a href=\"#\">TERMS</a><a href=\"#\">PRIVACY</a><a href=\"#\">COMPLIANCE</a></div>\n    </div>\n  </div>\n</footer>\n\n<script>\n  /* sticky nav */\n  const nav = document.getElementById('nav');\n  const ons = () => nav.classList.toggle('scrolled', window.scrollY > 8);\n  ons(); window.addEventListener('scroll', ons, {passive:true});\n\n  /* Rotating silhouette globe (orthographic) */\n  (async function(){\n    const cv = document.getElementById('globeCanvas');\n    if (!cv) return;\n    const ctx = cv.getContext('2d');\n    const W = cv.width, H = cv.height, R = 380, CX = W/2, CY = H/2;\n\n    function loadScript(src){return new Promise((res, rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}\n    try {\n      await loadScript(window.__resources?.d3 || 'https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js');\n      await loadScript(window.__resources?.topojson || 'https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js');\n    } catch(e){ return; }\n    let world;\n    try {\n      const r = await fetch(window.__resources?.worldAtlas || 'https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json');\n      world = await r.json();\n    } catch(e){ return; }\n    const land = topojson.feature(world, world.objects.land);\n\n    const projection = d3.geoOrthographic().scale(R).translate([CX, CY]).clipAngle(90);\n    let rot = 0;\n    function draw(){\n      ctx.clearRect(0,0,W,H);\n      projection.rotate([rot, -12, 0]);\n      const path = d3.geoPath(projection, ctx);\n\n      const g = ctx.createRadialGradient(CX-R*0.25, CY-R*0.25, R*0.1, CX, CY, R);\n      g.addColorStop(0,'rgba(255,255,255,0.05)');\n      g.addColorStop(1,'rgba(255,255,255,0.0)');\n      ctx.fillStyle = g;\n      ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.fill();\n\n      ctx.strokeStyle = 'rgba(255,255,255,0.22)';\n      ctx.lineWidth = 1.2;\n      ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.stroke();\n\n      ctx.beginPath();\n      path(land);\n      ctx.strokeStyle = 'rgba(255,255,255,0.6)';\n      ctx.lineWidth = 1;\n      ctx.stroke();\n\n      rot = (rot + 0.08) % 360;\n      requestAnimationFrame(draw);\n    }\n    draw();\n  })();\n\n  /* Corridors interactive */\n  const corridors = [\n    {pair:'NGN \u2192 EUR', name:'Lagos \u2192 Brescia',      rate:'1,466.80', time:'3.8', vol:'42.1', from:'Lagos',  to:'Brescia',      fromX:15, fromY:78, toX:85, toY:50},\n    {pair:'NGN \u2192 CNY', name:'Lagos \u2192 Shenzhen',     rate:'221.45',   time:'4.2', vol:'38.6', from:'Lagos',  to:'Shenzhen',     fromX:14, fromY:76, toX:86, toY:36},\n    {pair:'NGN \u2192 USD', name:'Lagos \u2192 New York',     rate:'1,601.20', time:'3.1', vol:'58.4', from:'Lagos',  to:'New York',     fromX:62, fromY:74, toX:20, toY:38},\n    {pair:'NGN \u2192 AED', name:'Lagos \u2192 Dubai',        rate:'436.02',   time:'2.9', vol:'22.8', from:'Lagos',  to:'Dubai',        fromX:18, fromY:78, toX:76, toY:55},\n    {pair:'NGN \u2192 GBP', name:'Lagos \u2192 London',       rate:'2,020.15', time:'3.4', vol:'18.9', from:'Lagos',  to:'London',       fromX:20, fromY:78, toX:78, toY:26},\n    {pair:'NGN \u2192 INR', name:'Lagos \u2192 Mumbai',       rate:'19.14',    time:'4.6', vol:'14.2', from:'Lagos',  to:'Mumbai',       fromX:14, fromY:76, toX:84, toY:60},\n    {pair:'NGN \u2192 ZAR', name:'Lagos \u2192 Johannesburg', rate:'86.40',    time:'3.7', vol:'9.8',  from:'Lagos',  to:\"Jo'burg\",      fromX:18, fromY:40, toX:76, toY:82},\n  ];\n  const corrList = document.getElementById('corrList');\n  corridors.forEach((c,i) => {\n    const row = document.createElement('div');\n    row.className = 'corr-row' + (i===0 ? ' active' : '');\n    row.dataset.idx = i;\n    row.innerHTML = `<span class=\"pair\">${c.pair}</span><span class=\"name\">${c.name}</span><span class=\"rate\">${c.rate}</span>`;\n    row.addEventListener('mouseenter', () => selectCorr(i));\n    row.addEventListener('click', () => selectCorr(i));\n    corrList.appendChild(row);\n  });\n  function selectCorr(i){\n    document.querySelectorAll('.corr-row').forEach(r => r.classList.toggle('active', +r.dataset.idx === i));\n    const c = corridors[i];\n    document.getElementById('sgPair').textContent = c.pair;\n    document.getElementById('sgTitle').innerHTML = `${c.from} to <span class=\"serif\">${c.to}.</span>`;\n    document.getElementById('ssRate').textContent = c.rate;\n    document.getElementById('ssTime').innerHTML = `${c.time}<small>hrs</small>`;\n    document.getElementById('ssVol').innerHTML = `$${c.vol}<small>M</small>`;\n    const mf = document.getElementById('mapFrom');\n    const mt = document.getElementById('mapTo');\n    mf.textContent = c.from; mt.textContent = c.to;\n    mf.style.left = c.fromX+'%'; mf.style.top = c.fromY+'%';\n    mt.style.left = c.toX+'%';   mt.style.top = c.toY+'%';\n    const sw = 800, sh = 160;\n    const fx = (c.fromX/100)*sw, fy = (c.fromY/100)*sh;\n    const tx = (c.toX/100)*sw, ty = (c.toY/100)*sh;\n    const cx = (fx+tx)/2, cy = Math.min(fy,ty) - 80;\n    document.getElementById('arcPath').setAttribute('d', `M ${fx} ${fy} Q ${cx} ${cy} ${tx} ${ty}`);\n    const fd = document.getElementById('fromDot');\n    const fr = document.getElementById('fromRing');\n    const td = document.getElementById('toDot');\n    fd.setAttribute('cx', fx); fd.setAttribute('cy', fy);\n    fr.setAttribute('cx', fx); fr.setAttribute('cy', fy);\n    td.setAttribute('cx', tx); td.setAttribute('cy', ty);\n  }\n</script>\n\n\n</body></html>"
  </script>
